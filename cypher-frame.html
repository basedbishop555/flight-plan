<!doctype html>
<html><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src https://www.saero.org 'unsafe-inline'; connect-src 'none'; img-src 'none'; style-src 'none'; frame-src 'none'; form-action 'none'; base-uri 'none'">
<title>Cypher's picks (sandboxed)</title></head>
<body><script>
/* Cypher's picks, exactly (11/6/2026). Flight Plan opens this page in a hidden iframe with sandbox="allow-scripts"
   (no same-origin): it cannot touch Flight Plan's page, your wallet, cookies or storage, and the policy above blocks
   every network request except loading saero.org's own planner (plan.js) from saero.org. Flight Plan posts saero.org's
   public data and your locks' public on-chain state; this page runs NYCypher's advise() on them, unchanged, and posts
   back plain data, which Flight Plan checks before showing anything. MIT licensed (this file); plan.js is his. */
(function () {
  "use strict";
  var loading = null;
  function load(v) {
    if (window.SaeroPlan) return Promise.resolve();
    if (loading) return loading;
    loading = new Promise(function (ok, no) {
      var s = document.createElement("script");
      s.src = "https://www.saero.org/plan.js" + (v ? "?v=" + encodeURIComponent(v) : "");
      s.onload = function () { window.SaeroPlan ? ok() : no(new Error("saero.org's planner loaded without its API")); };
      s.onerror = function () { loading = null; no(new Error("saero.org's planner did not load")); };
      document.head.appendChild(s);
    });
    return loading;
  }
  function rows(e) {
    var best = (e.explain && e.explain.best) || [];
    return best.filter(function (r) { return r && r.pool && r.pct > 0; }).map(function (r) {
      return { pool: String(r.pool).toLowerCase(), pct: Number(r.pct), name: String((r.pair || "") + (r.kind ? " " + r.kind : "")).slice(0, 48), kept: !!r.kept };
    });
  }
  window.addEventListener("message", function (ev) {
    if (ev.source !== window.parent) return;
    var m = ev.data || {};
    if (m.type !== "advise") return;
    load(m.v).then(function () {
      var A = window.SaeroPlan.advise({ sum: m.sum, locks: m.locks, cal: m.cal, now: m.now, nets: m.nets || null });
      var out = (A.locks || []).map(function (e) {
        return { name: String(e.name || ""), wouldMove: !!e.wouldMove, poolsN: Number(e.poolsN) || null, state: typeof e.state === "string" ? e.state : null,
                 bestUsdPerDay: Number(e.bestUsdPerDay) || 0, stayUsdPerDay: Number(e.stayUsdPerDay) || 0, gain: Number(e.gain) || 0, best: rows(e) };
      });
      window.parent.postMessage({ type: "advice", id: m.id, locks: out }, "*");
    }).catch(function (err) {
      window.parent.postMessage({ type: "advice", id: m.id, error: String((err && err.message) || err) }, "*");
    });
  });
  window.parent.postMessage({ type: "frame-ready" }, "*");
})();
</script></body></html>
